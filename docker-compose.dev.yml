# Rewind - local development compose. Builds images locally instead of pulling them.
name: rewind-dev
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: rewind-backend:dev
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: rewind-frontend:dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data_dev:
