# Rewind - submission compose. Uses pre-built public images (no build step).
# Run from an empty folder that contains only: docker-compose.yml, .env, PROJECT_INFO.docx
name: rewind
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # NOTE: port 27017 is intentionally NOT published to the host (internal only, security).
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${DOCKERHUB_USER:-TODO_USER}/rewind-backend:1.1.0
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: ${DOCKERHUB_USER:-TODO_USER}/rewind-frontend:1.1.0
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
